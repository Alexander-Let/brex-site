<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/mascot-shoebill.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        const t = localStorage.getItem('brex-theme')
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark')
      } catch {}
    </script>
    <meta
      name="description"
      content="Brex is a compilable spec language for AI coding agents. Write prompts like code: roles, rules, tasks, gates — compiled to IR and Markdown prompts."
    />
    <meta
      name="keywords"
      content="Brex, AI coding agents, prompt language, spec language, язык промптов, AI-агенты, LLM prompts"
    />
    <meta property="og:title" content="Brex — write prompts like code for AI agents" />
    <meta
      property="og:description"
      content="A compilable spec language for AI coding agents. Write a spec, get IR, Markdown prompts, and policy."
    />
    <meta property="og:type" content="website" />
    <title>Brex — spec language for AI coding agents</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
